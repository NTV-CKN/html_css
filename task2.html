<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form title="tmp">
        <table border="1">
            <thead>
                <tr>
                    <th bgcolor="yellow" align="start" colspan="2" scope="row"><h1 >Registration Form</h1></th>
                </tr>
            </thead>

            <tbody>
                <!-- input email -->
                <tr>
                    <td>Enter name</td>
                    <td><input type="email" name="email" /></td>
                </tr>
                <!-- input password -->
                <tr>
                    <td>Enter password</td>
                    <td><input type="password" name="password" /></td>
                </tr>
                <!-- input address -->
                <tr>
                    <td>Enter address</td>
                    <td><textarea name="address" name="address"></textarea></td>
                </tr>
                <!-- select game -->
                <tr>
                    <td>Select game</td>
                    <td>
                        <input type="checkbox" id="hockey" name="game">
                        <label for="hockey">Hockey</label>
                        <br>
                        <input type="checkbox" id="football" name="game">
                        <label for="football">Football</label>
                        <br>
                        <input type="checkbox" id="badminton" name="game">
                        <label for="badminton">Badminton</label>
                        <br>
                        <input type="checkbox" id="Cricket" name="game">
                        <label for="Cricket">Cricket</label>
                        <br>
                        <input type="checkbox" id="volleyball" name="game">
                        <label for="volleyball">Volleyball</label>
                    </td>
                </tr>
                <!-- select gender -->
                <tr>
                    <td>Select gender</td>
                    <td>
                        <input type="radio" id="male" name="gender">
                        <label for="male">Male</label>

                        <input type="radio" id="female" name="gender">
                        <label for="female">Female</label>
                    </td>
                </tr>
                <!-- choose age -->
                <tr>
                    <td>Age</td>
                    <td>
                        <select name="age">
                            <option value="18">18</option>
                            <option value="18">19</option>
                            <option value="20">20</option>
                            <option value="21">21</option>
                        </select>
                    </td>
                </tr>
                <!-- choose file -->
                <tr>
                    <td>Avatar</td>
                    <td><input type="file" name="choose_file" /></td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="2" bgcolor="yellow"><input type="button" value="Click me" name="click_me" />
                        <input type="reset" name="reset" />
                        <input type="submit" name="submit" />
                    </td>
                </tr>
            </tfoot>
        </table>
    </form>
</body>

</html>
